<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- DevOps segmented infinity loop -->
  <g transform="translate(600,95)">
    <!-- left loop (DEV) - 4 segments with gaps, like Code/Plan/Build/Test -->
    <circle cx="-65" cy="0" r="62" fill="none" stroke="#7dd3fc" stroke-width="22"
            stroke-dasharray="80 15" stroke-linecap="round" transform="rotate(-20 -65 0)"/>

    <!-- right loop (OPS) - 4 segments with gaps, like Deploy/Operate/Monitor/Release -->
    <circle cx="65" cy="0" r="62" fill="none" stroke="#38bdf8" stroke-width="22"
            stroke-dasharray="80 15" stroke-linecap="round" transform="rotate(160 65 0)"/>

    <!-- inner circles to create ring/hole look -->
    <circle cx="-65" cy="0" r="34" fill="#0f172a"/>
    <circle cx="65" cy="0" r="34" fill="#0f172a"/>

    <!-- small arrow chevrons marking segment transitions -->
    <path d="M -18 -50 L -6 -58 L -8 -44 Z" fill="#e0f2fe"/>
    <path d="M -108 5 L -118 -8 L -104 -8 Z" fill="#e0f2fe"/>
    <path d="M -18 52 L -6 60 L -8 46 Z" fill="#e0f2fe"/>
    <path d="M 20 -50 L 8 -58 L 10 -44 Z" fill="#bfe6ff"/>
    <path d="M 108 5 L 118 -8 L 104 -8 Z" fill="#bfe6ff"/>
    <path d="M 20 52 L 8 60 L 10 46 Z" fill="#bfe6ff"/>

    <text x="-65" y="7" font-family="Segoe UI, Verdana, sans-serif" font-size="19" font-weight="700"
          fill="#7dd3fc" text-anchor="middle">DEV</text>
    <text x="65" y="7" font-family="Segoe UI, Verdana, sans-serif" font-size="19" font-weight="700"
          fill="#38bdf8" text-anchor="middle">OPS</text>
  </g>

  <text x="600" y="215" font-family="Segoe UI, Verdana, sans-serif" font-size="48" font-weight="700"
        fill="#ffffff" text-anchor="middle">SAUMYA KUMAR</text>
  <text x="600" y="255" font-family="Segoe UI, Verdana, sans-serif" font-size="21" font-weight="400"
        fill="#7dd3fc" text-anchor="middle">Aspiring Cloud &amp; DevOps Engineer</text>
  <text x="600" y="290" font-family="Segoe UI, Verdana, sans-serif" font-size="15" font-weight="400"
        fill="#94a3b8" text-anchor="middle">Azure · AWS · Terraform · Docker · Kubernetes · ArgoCD · CI/CD · GitOps</text>
</svg>
