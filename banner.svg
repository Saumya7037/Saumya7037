<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- DevOps infinity loop, top right -->
  <g transform="translate(1000,55) scale(1.1)" opacity="0.85">
    <path d="M -40 0 C -40 -22, -14 -22, 0 0 C 14 22, 40 22, 40 0 C 40 -22, 14 -22, 0 0 C -14 22, -40 22, -40 0 Z"
          fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Cloud icon, bottom right -->
  <path d="M 900 225 q -20 -35 20 -45 q 5 -30 35 -32 q 25 -20 50 5 q 30 -5 30 25 q 20 10 5 35 q -10 15 -30 12 z"
        fill="#ffffff" opacity="0.15"/>

  <!-- Container stack icon, left -->
  <rect x="70" y="55" width="34" height="34" rx="4" fill="#38bdf8" opacity="0.35"/>
  <rect x="110" y="55" width="34" height="34" rx="4" fill="#38bdf8" opacity="0.55"/>
  <rect x="90" y="93" width="34" height="34" rx="4" fill="#38bdf8" opacity="0.45"/>

  <!-- Gear, bottom left -->
  <circle cx="110" cy="225" r="22" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="110" cy="225" r="9" fill="none" stroke="#7dd3fc" stroke-width="4" opacity="0.6"/>

  <text x="600" y="130" font-family="Segoe UI, Verdana, sans-serif" font-size="50" font-weight="700"
        fill="#ffffff" text-anchor="middle">SAUMYA KUMAR</text>
  <text x="600" y="172" font-family="Segoe UI, Verdana, sans-serif" font-size="22" font-weight="400"
        fill="#7dd3fc" text-anchor="middle">Aspiring Cloud &amp; DevOps Engineer</text>
  <text x="600" y="208" font-family="Segoe UI, Verdana, sans-serif" font-size="15" font-weight="400"
        fill="#94a3b8" text-anchor="middle">AWS · Terraform · Docker · Kubernetes · ArgoCD · CI/CD · GitOps</text>
</svg>
